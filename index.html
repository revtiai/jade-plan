    position:fixed; inset:0; width:100%; height:100%;

    opacity:0; animation: videoIn 1.4s ease .3s forwards;
  }
  @keyframes videoIn { to { opacity:.62; } }
  .scrim {
    position:fixed; inset:0; pointer-events:none; z-index:-1;

    position:fixed; width:820px; height:820px; right:-250px; top:-330px;
    pointer-events:none; z-index:-3;
    background: radial-gradient(circle, rgba(120,180,255,.20) 0%, rgba(120,180,255,.05) 44%, transparent 66%);
    animation: drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(0,0,0) scale(1); }
    to   { transform: translate3d(-60px,50px,0) scale(1.12); }
  }

  @keyframes fadeSlideUp { from { opacity:0; transform:translateY(24px);} to { opacity:1; transform:translateY(0);} }
  .lock { position:relative; width:100%; max-width:26rem; animation: fadeSlideUp .8s ease .1s both; }
  .badge { display:flex; align-items:center; gap:10px; font-size:.82rem; color:rgba(255,255,255,.72); margin-bottom:20px; }
  .dot { width:7px; height:7px; border-radius:50%; background:#F5A524; box-shadow:0 0 0 5px rgba(245,165,36,.16); }
  h1 { font-size:2rem; font-weight:500; letter-spacing:-.03em; line-height:1.1; margin-bottom:12px; }
  p.intro { font-size:.95rem; line-height:1.6; color:rgba(255,255,255,.55); margin-bottom:28px; }
  .row { display:flex; gap:10px; }
  input {
    flex:1; min-width:0; font:inherit; font-size:1rem;
    padding:13px 15px; border-radius:10px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.04); color:#fff;
  }
  input::placeholder { color:rgba(255,255,255,.35); }
  input:focus-visible, button:focus-visible { outline:2px solid rgba(255,255,255,.7); outline-offset:2px; }
  button {
    font:inherit; font-size:1rem; font-weight:500; padding:13px 24px; cursor:pointer;
    border:0; border-radius:10px; background:#fff; color:#000;
    transition: transform .2s;
  }
  button:hover:not(:disabled) { transform: scale(1.04); }
  button:disabled { opacity:.5; cursor:default; }
  #err { margin-top:16px; font-size:.88rem; line-height:1.5; color:#F08272; min-height:1.35em; }
  .hint { margin-top:26px; font-size:.8rem; color:rgba(255,255,255,.3); line-height:1.55; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  btn.disabled = true; err.textContent = "Unlocking\u2026";
